[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes"
version = "0.1.0"
description = "Pipeline de consignação de uma distribuidora fictícia: emite remessas, lê os relatórios das lojas, concilia e fecha o mês."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "pandas>=3.0",
  "numpy>=2.3",
  "psycopg[binary]>=3.3",
  "openpyxl>=3.1",
  "pymupdf>=1.26",
  "pdfplumber>=0.11",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-cov>=7", "ruff>=0.15"]

[project.scripts]
hermes = "hermes.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hermes = ["infra/sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
